services:
  db:
    image: postgis/postgis:16-3.4
    container_name: barrhopp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: barrhopp
      POSTGRES_USER: barrhopp
      POSTGRES_PASSWORD: barrhopp
    ports:
      - "5432:5432"
    volumes:
      - barrhopp-db-data:/var/lib/postgresql/data
      - ./docker/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barrhopp -d barrhopp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  barrhopp-db-data:
