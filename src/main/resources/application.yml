spring:
  application:
    name: barrhopp-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns schema changes; Hibernate must never auto-generate DDL.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Required so Hibernate maps PostGIS geometry columns (used by VenueFact's
        # future location-aware queries and Venue's coordinates) correctly.
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  # MUST be supplied via JWT_SECRET (>= 32 chars) in any real deployment.
  # There is deliberately no default here - the only default lives in
  # application-local.yml so it can never leak into a non-local profile.
  secret: ${JWT_SECRET:}
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api/v1/docs
  swagger-ui:
    path: /api/v1/docs/ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
